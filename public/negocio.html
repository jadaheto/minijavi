<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel del negocio</title>
  <meta name="description" content="Pedidos, citas e interesados que atendió el asistente del negocio.">
  <link rel="stylesheet" href="./css/panel.css">
  <style>
    /* Panel del cliente (modo negocio): misma base que el panel de Javier, en una sola columna. */
    .shell { width: min(56rem, 100%); margin-inline: auto; padding: var(--space-6) clamp(1rem, 4vw, 2rem) var(--space-7); display: grid; gap: var(--space-5); }
    .shell-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--space-3); }
    .shell-head p { color: var(--ink-2); margin-top: var(--space-1); }
    .mark { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--brand, var(--accent)); margin-right: .35em; }
    .seg { display: flex; gap: var(--space-1); overflow-x: auto; scrollbar-width: none; padding: var(--space-1); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .seg button { display: flex; align-items: center; gap: var(--space-2); min-height: 0; padding: 7px var(--space-4); border: 0; background: transparent; color: var(--ink-2); font: 500 .95rem/1.4 var(--font-body); white-space: nowrap; }
    .seg button:hover { background: var(--raised); color: var(--ink); }
    .seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
    ul.list > li[data-status="atendido"] > :not(.row:last-child), ul.list > li[data-status="cancelado"] > :not(.row:last-child) { color: var(--ink-3); }
    .gate form { display: grid; gap: var(--space-3); }
  </style>
</head>
<body>
  <div class="gate" id="login" hidden>
    <section class="card">
      <h1>Panel del negocio</h1>
      <p>Escribe la clave que te entregaron. Este dispositivo queda autorizado por 30 días.</p>
      <form id="login-form"><input id="clave" type="password" autocomplete="current-password" placeholder="Clave del panel" aria-label="Clave del panel"><button type="submit">Entrar</button></form>
      <p id="login-error" class="msg" role="alert"></p>
    </section>
  </div>
  <main class="shell" id="panel" hidden>
    <div class="shell-head">
      <div><h1><span class="mark" aria-hidden="true"></span><span id="nombre">Panel</span></h1><p id="resumen"></p></div>
      <a href="./">Ir al asistente</a>
    </div>
    <section class="card" id="avisos" aria-label="Avisos"></section>
    <nav class="seg" role="tablist" id="tabs" aria-label="Secciones"></nav>
    <section class="card"><h2 id="titulo"></h2><ul class="list" id="lista"></ul><p id="vacio" hidden></p></section>
  </main>
  <script src="./js/negocio.js"></script>
</body>
</html>
