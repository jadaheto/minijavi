<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101418">
  <title>Avatar de Javier</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="cover-bg" class="cover-bg" aria-hidden="true"></div>
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <div id="photo-bg" class="photo-bg" aria-hidden="true"></div>
  <canvas id="stage" aria-label="Avatar"></canvas>
  <div id="fx" class="fx" aria-hidden="true"></div>
  <a id="cover-art" class="cover-art" target="_blank" rel="noopener" hidden><img alt="" crossorigin="anonymous"><img class="spotify-logo" src="./img/spotify-logo-white.svg" alt="Spotify"></a>

  <header class="hud">
    <div id="status" class="status" data-state="idle"><span class="dot"></span><span id="status-text">En espera</span></div>
    <div id="owner" class="owner" hidden>Modo Javier</div>
    <div id="demo" class="owner demo" hidden></div>
    <div id="work" class="work" hidden><span class="work-dot"></span><span id="work-text"></span></div>
    <div id="mic" class="mic" hidden><span class="mic-dot"></span>Micrófono activo</div>
  </header>

  <aside id="card" class="card-panel" hidden aria-live="polite">
    <h2 id="card-title"></h2>
    <ul id="card-lines"></ul>
    <img id="card-qr" alt="Código QR de contacto" hidden>
    <p id="card-caption"></p>
  </aside>

  <aside id="gallery" class="gallery" hidden aria-live="polite">
    <h2 id="gallery-title"></h2>
    <div id="gallery-items" class="gallery-items"></div>
    <p id="gallery-credit" class="gallery-credit"></p>
  </aside>

  <aside id="tesla" class="tsl" hidden aria-live="polite"></aside>
  <aside id="news" class="nws" hidden aria-live="polite"></aside>
  <aside id="markets" class="nws mkt" hidden aria-live="polite"></aside>
  <aside id="panel" class="nws pnl" hidden aria-live="polite"></aside>

  <aside id="music" class="music" hidden>
    <div id="music-player"></div>
    <img class="spotify-logo music-logo" src="./img/spotify-logo-white.svg" alt="Spotify">
    <div class="music-bar">
      <a class="music-cover" target="_blank" rel="noopener" hidden><img alt="" crossorigin="anonymous"></a>
      <div class="music-text"><span class="music-title"></span><span class="music-artist"></span></div>
      <span class="music-vol"></span>
    </div>
    <div class="music-ctl">
      <button type="button" data-act="prev" aria-label="Anterior">⏮</button>
      <button type="button" data-act="toggle" aria-label="Pausar">⏸</button>
      <button type="button" data-act="next" aria-label="Siguiente">⏭</button>
      <a class="music-open" target="_blank" rel="noopener" hidden>Abrir en Spotify</a>
    </div>
  </aside>

  <section id="subtitles" class="subtitles" aria-live="polite">
    <p id="sub-user" class="sub-user"></p>
    <p id="sub-avatar" class="sub-avatar"></p>
  </section>

  <div id="away" class="away" hidden><span id="away-text"></span><span id="away-notice" class="away-notice"></span></div>

  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card">
      <h1>Avatar de Javier</h1>
      <p id="gate-text">Toca para empezar a conversar. El navegador te pedirá permiso para usar el micrófono.</p>
      <input id="code" type="password" inputmode="text" autocomplete="off" placeholder="Código de acceso" hidden>
      <button id="btn-start" type="submit">Hablar con Javier</button>
      <p id="gate-error" class="gate-error" role="alert"></p>
    </form>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
